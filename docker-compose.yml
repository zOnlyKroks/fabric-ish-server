services:
  mc:
    image: itzg/minecraft-server:${MC_IMAGE_TAG:-java25}
    container_name: mc
    restart: unless-stopped
    tty: true
    stdin_open: true
    stop_grace_period: 60s
    ports:
      - "25565:25565"
      # Simple Voice Chat
      - "24454:24454/udp"
      # BlueMap web map
      - "${BLUEMAP_BIND:-0.0.0.0}:${BLUEMAP_PORT:-8100}:8100"
    # Anything in .env is also passed through, so any itzg variable
    # (SEED, VIEW_DISTANCE, PVP, SPAWN_PROTECTION, MODE, ...) can just be added there.
    # https://docker-minecraft-server.readthedocs.io/en/latest/variables/
    env_file:
      - .env
    environment:
      EULA: "TRUE"
      MAX_TICK_TIME: "-1"
      TYPE: FABRIC
      VERSION: "${MC_VERSION:-26.3}"
      FABRIC_LOADER_VERSION: "${FABRIC_LOADER_VERSION:-0.20.1}"
      SEED: "${MC_SEED:-}"
      # packwiz-installer syncs mods from the upstream pack on every start.
      # ./revert.sh sets PACKWIZ_URL_OVERRIDE (empty) in .env to freeze mods while
      # a snapshot is restored; an empty value disables the sync.
      PACKWIZ_URL: "${PACKWIZ_URL_OVERRIDE-${PACK_URL}}"
      MEMORY: "${MC_MEMORY:-4G}"
      USE_AIKAR_FLAGS: "false"
      USE_MEOWICE_FLAGS: "false"
      JVM_XX_OPTS: "${JVM_XX_OPTS:--XX:+UseZGC}"
      MOTD: "${MC_MOTD:-Holiday-ish server}"
      MAX_PLAYERS: "${MC_MAX_PLAYERS:-10}"
      DIFFICULTY: "${MC_DIFFICULTY:-normal}"
      ENABLE_WHITELIST: "${MC_WHITELIST:-true}"
      ENFORCE_WHITELIST: "true"
      OPS: "${MC_OPS:-}"
      # No RCON: whitelist/ops sync and pack updates run inside the server (holiday mod).
      ENABLE_RCON: "false"
      # Lets `docker compose exec mc mc-send-to-console <command>` reach the server console.
      CREATE_CONSOLE_IN_PIPE: "true"
      # The repo's config/ folder is copied over data/config on EVERY start (see volumes), so
      # these files are the source of truth and manual edits on the server are replaced.
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      REPLACE_ENV_DURING_SYNC: "false"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - ./data:/data
      # Snapshots written by the holiday mod before a pack update (see revert.sh).
      - ./backups:/backups
      # Pack config (c2me.toml, vss-server-config.yaml, streamsreflowing.properties, ...), enforced
      # on every start. Add a file to config/ in the repo and the server uses it after a restart.
      - ./config:/config:ro
      # Server config files from the repo, mounted read-only one by one: the container always
      # sees exactly the repo version, nothing is copied or merged. (whitelist.json and
      # ops.json are synced by the holiday mod from WHITELIST_URL / OPS_URL.)
      - ./server-config/config/chunkyborder/borders.json:/data/config/chunkyborder/borders.json:ro
      - ./server-config/config/bluemap/core.conf:/data/config/bluemap/core.conf:ro
      - ./server-config/config/bluemap/webserver.conf:/data/config/bluemap/webserver.conf:ro
      - ./server-config/config/bluemap/storages/file.conf:/data/config/bluemap/storages/file.conf:ro
